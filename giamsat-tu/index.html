<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điều khiển tủ chiếu sáng</title>
<meta name="description" content="App cá nhân giám sát và điều khiển tủ chiếu sáng công cộng: đo dòng, áp, điện năng, đầu vào/ra, cửa tủ, điều khiển từ xa.">
<meta name="theme-color" content="#1a6fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#17212b; --muted:#5f6b78; --line:#e2e7ed; --soft:#eef1f4;
  --accent:#1a6fd8; --accent-ink:#ffffff; --accent-bg:#e7f0fd;
  --ok:#1f9d55; --warn:#c77d00; --bad:#d63a3a; --off:#8a96a3;
  --ok-bg:#e6f6ec; --warn-bg:#fff4dc; --bad-bg:#fdeaea;
  --pa:#d6451f; --pb:#c99700; --pc:#2b6fd6; --lamp:#f2b705;
  --shadow:0 2px 10px rgba(16,30,50,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1419; --card:#18202a; --ink:#e7edf3; --muted:#9aa7b4; --line:#2a3542; --soft:#222c37;
    --accent:#4d9bff; --accent-ink:#06121f; --accent-bg:#14263d;
    --ok:#3ccf7d; --warn:#f0b13a; --bad:#ff6b6b; --off:#7d8996;
    --ok-bg:#12301f; --warn-bg:#33270c; --bad-bg:#3a1717;
    --pa:#ff7a52; --pb:#f2c53d; --pc:#5e9bff; --lamp:#ffd23f;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1419; --card:#18202a; --ink:#e7edf3; --muted:#9aa7b4; --line:#2a3542; --soft:#222c37;
  --accent:#4d9bff; --accent-ink:#06121f; --accent-bg:#14263d;
  --ok:#3ccf7d; --warn:#f0b13a; --bad:#ff6b6b; --off:#7d8996;
  --ok-bg:#12301f; --warn-bg:#33270c; --bad-bg:#3a1717;
  --pa:#ff7a52; --pb:#f2c53d; --pc:#5e9bff; --lamp:#ffd23f;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
a{color:var(--accent);text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}

/* ---------- Khung ---------- */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:9px 16px}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.hchip{display:flex;align-items:center;gap:6px;background:var(--soft);padding:5px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 24px}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.nav a{flex:1;text-align:center;padding:8px 2px 9px;font-size:11.5px;color:var(--muted);position:relative}
nav.nav a b{display:block;font-size:20px;line-height:1.25}
nav.nav a.on{color:var(--accent);font-weight:700}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;font-weight:700;line-height:17px}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:210px}
  nav.nav{top:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 10px 10px;gap:4px}
  nav.nav a{flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px}
  nav.nav a b{display:inline;font-size:18px}
  nav.nav a.on{background:var(--accent-bg)}
  nav.nav .badge{position:static;margin-left:auto}
  header{z-index:35;margin-left:-210px;padding-left:16px}
  .hwrap{max-width:none}
}

/* ---------- Thành phần ---------- */
h1{font-size:19px;margin:2px 0 12px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:5px solid var(--ok);display:block;color:inherit}
.card.s-bad{border-left-color:var(--bad)}.card.s-warn{border-left-color:var(--warn)}.card.s-off{border-left-color:var(--off)}
.cid{font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.acc{background:var(--accent-bg);color:var(--accent)}
.lamps{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.lamp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--muted);border:1px solid transparent}
.lamp i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.lamp.on{background:var(--warn-bg);color:var(--ink);border-color:var(--lamp)}
.lamp.on i{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
button.lamp{cursor:pointer;padding:5px 10px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph{background:var(--soft);border-radius:8px;padding:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.ph i{font-style:normal;font-weight:700;margin-right:4px}
.ph.zero{background:var(--bad-bg);color:var(--bad)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}.bar div{height:100%}
.alarms{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.tabs a,.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--ink);cursor:pointer}
.tabs a.on,.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.num,th.num{text-align:right}
.io{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.io:last-child{border-bottom:0}
.led{width:14px;height:14px;border-radius:50%;background:var(--off);flex:none}
.led.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.led.lampon{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch.on{background:var(--ok)}.switch.on::after{left:25px}
.switch.pending{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,select.in,input.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;max-width:100%}
input[type=time].in{padding:6px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
.cols>*{min-width:0}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
canvas{width:100%;height:170px;display:block;background:var(--soft);border-radius:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:5px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.faults{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.faults .btn{justify-content:flex-start;text-align:left;font-weight:500;font-size:13.5px}
.console{background:#0b1016;color:#b9e3c6;border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.console .t{color:#7fb2ff}.console .a{color:#ff9a8a}.console .s{color:#f2c53d}.console .c{color:#d6a8ff}
.inc .act{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 9px;margin-top:8px}
.inc .log{font-size:12px;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.modal{position:fixed;z-index:51;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:none}
.modal.on,.modal-bg.on{display:block}
@media (min-width:700px){.modal{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:480px;border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:min(92vw,520px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.back{display:inline-block;margin-bottom:6px;font-size:14px}
.ctl-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctl-row input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px}
.sticky-bar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border-radius:14px;box-shadow:0 -2px 14px rgba(0,0,0,.12);padding:10px 12px;margin-top:10px}
@media (min-width:900px){.sticky-bar{bottom:12px}}
pre.report{white-space:pre-wrap;background:var(--soft);padding:10px;border-radius:10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
@media (max-width:420px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">Điều khiển tủ chiếu sáng<small id="hsub">App cá nhân</small></div>
    <div class="hchip" id="clockChip" title="Giờ mô phỏng"><span id="dayIcon">🌙</span><span id="simTime">--:--</span></div>
    <a class="hchip" href="#/cai-dat" id="connChip" title="Kết nối"><span class="dot" id="connDot"></span><span id="connTxt">Demo</span></a>
  </div>
</header>

<nav class="nav" id="nav">
  <a href="#/" data-r="home"><b>📊</b>Tổng quan</a>
  <a href="#/tu" data-r="tu"><b>🗄️</b>Tủ</a>
  <a href="#/dieu-khien" data-r="dieu-khien"><b>🎛️</b>Điều khiển</a>
  <a href="#/canh-bao" data-r="canh-bao"><b>🚨</b>Cảnh báo<span class="badge" id="incBadge" hidden>0</span></a>
  <a href="#/cai-dat" data-r="cai-dat"><b>⚙️</b>Cài đặt</a>
</nav>

<main id="main"></main>

<div class="modal-bg" id="modalBg"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   1. CẤU HÌNH – các ngưỡng giống hệt firmware tu_chieu_sang.ino
   ===================================================================== */
const CFG = {
  I_LOADED: 1.0, I_ZERO: 0.2, V_LOST: 100, V_MIN_OK: 180, V_MAX_OK: 250,
  TILT_ALARM: 15, VIB_ALARM_G: 0.6, DEBOUNCE_N: 3, VOLT_DEBOUNCE_N: 10, FB_DEBOUNCE_N: 5,
  GRACE_TICKS: 10,            // firmware: 30 s – rút ngắn cho demo
  COLLISION_COOLDOWN_TICKS: 60,
  TELE_EVERY: 5,              // firmware: 10 s
  LWT_AFTER: 15, OFFLINE_AFTER_S: 30, CMD_TIMEOUT_MS: 10000, PIN_UNLOCK_MS: 5 * 60000,
  HIST: 120
};
const N_DO = 4;
const DI = {DOOR: 0, CB: 1, FB1: 2, FB2: 3, SPD: 4, AUTO: 5};
const FB_OF_DO = [DI.FB1, DI.FB2, -1, -1];
const DEF_DO = ['K1 · Cả đêm', 'K2 · Nửa đêm', 'K3 · Trang trí', 'K4 · Dự phòng'];
const DEF_DI = ['Cửa tủ', 'CB tổng', 'Phản hồi K1', 'Phản hồi K2', 'Chống sét (SPD)', 'Công tắc Tay/Tự động'];
const DI_META = [            // cách đọc mức 1/0 và mức bình thường của từng DI
  {on: 'Mở', off: 'Đóng', normal: 0},
  {on: 'Đóng', off: 'Cắt / nhảy', normal: 1},
  {on: 'Đóng', off: 'Mở', normal: null},
  {on: 'Đóng', off: 'Mở', normal: null},
  {on: 'Tốt', off: 'Hỏng', normal: 1},
  {on: 'Tự động', off: 'Tay tại chỗ', normal: 1}
];
const DEF_SCHED = [[1, 1080, 330], [1, 1080, 1380], [1, 1110, 1320], [0, 1080, 330]];
const SIM_SHARE = [0.6, 0.3, 0.1, 0];

const ALARM = {
  CAT_CAP:     {label: 'Nghi cắt / trộm cáp', sev: 3, icon: '✂️', act: 'Cử tổ kiểm tra tuyến cáp sau tủ, chụp ảnh hiện trường. Nếu xác nhận mất cắp: báo công an phường, lập biên bản.'},
  VA_CHAM:     {label: 'Xe va chạm', sev: 3, icon: '💥', act: 'Kiểm tra trụ/tủ, chụp ảnh, ghi biển số xe và thông tin người gây ra (nếu có), lập biên bản bồi thường.'},
  MO_CUA:      {label: 'Mở cửa tủ trái phép', sev: 3, icon: '🚪', act: 'Xác minh có tổ nào đang làm việc tại tủ không. Nếu không có: cử người đến kiểm tra ngay.'},
  CB_TONG:     {label: 'CB tổng bị cắt / nhảy', sev: 3, icon: '🔻', act: 'Kiểm tra chạm chập trên tuyến trước khi đóng lại CB tổng.'},
  MAT_DIEN:    {label: 'Mất điện lưới', sev: 2, icon: '⚡', act: 'Liên hệ điện lực khu vực hỏi lịch cắt điện hoặc sự cố lưới.'},
  MAT_PHA:     {label: 'Mất pha', sev: 2, icon: '⚡', act: 'Kiểm tra cầu chì, đầu cốt pha bị mất, báo điện lực nếu mất từ lưới.'},
  K_KHONG_DONG:{label: 'Contactor không đóng', sev: 2, icon: '🧲', act: 'Kiểm tra cuộn hút, relay trung gian, dây điều khiển của contactor.'},
  K_KHONG_CAT: {label: 'Contactor dính, không cắt', sev: 2, icon: '🧲', act: 'Tiếp điểm contactor bị dính – thay contactor.'},
  KHONG_SANG:  {label: 'Đèn không sáng', sev: 2, icon: '🌑', act: 'Contactor đã đóng nhưng không có dòng: kiểm tra CB nhánh, cầu chì, tuyến cáp.'},
  NGHIENG:     {label: 'Tủ / trụ bị nghiêng', sev: 2, icon: '📐', act: 'Kiểm tra móng, chân đế; rào chắn nếu có nguy cơ đổ.'},
  MAT_KET_NOI: {label: 'Mất kết nối thiết bị', sev: 2, icon: '📡', act: 'Kiểm tra nguồn gateway, SIM 4G / Wi-Fi tại tủ. Tủ vẫn chạy theo lịch và gửi bù cảnh báo khi có mạng.'},
  SPD:         {label: 'Chống sét hỏng', sev: 1, icon: '🌩️', act: 'Thay module chống sét (SPD) trước mùa mưa bão.'},
  CHE_DO_TAY:  {label: 'Tủ đang ở chế độ Tay', sev: 1, icon: '✋', act: 'Công tắc tại tủ đang để Tay: app không điều khiển được. Nhắc tổ trả về Tự động sau khi làm xong.'},
  SANG_NGAY:   {label: 'Đèn sáng ngoài lịch', sev: 1, icon: '☀️', act: 'Các kênh đã cắt nhưng vẫn có dòng – kiểm tra đấu nối, contactor.'},
  DIEN_AP:     {label: 'Điện áp bất thường', sev: 1, icon: '〰️', act: 'Theo dõi; báo điện lực nếu kéo dài.'},
  LOI_DONG_HO: {label: 'Lỗi đồng hồ RS485', sev: 1, icon: '🔌', act: 'Kiểm tra dây RS485, nguồn đồng hồ, địa chỉ Modbus.'}
};
const ACK_MSG = {'OK': 'Đã thực hiện', 'Tu dang o che do Tay tai cho': 'Tủ đang ở chế độ Tay tại chỗ', 'Tham so sai': 'Tham số sai',
  'Lich sai': 'Lịch không hợp lệ', 'Che do sai': 'Chế độ không hợp lệ', 'Lenh khong ho tro': 'Thiết bị không hỗ trợ lệnh này', 'Sai cu phap': 'Sai cú pháp'};
const STATUS = {new: 'Mới', assigned: 'Đã giao', doing: 'Đang xử lý', done: 'Hoàn thành'};

const SAMPLE = [
  {id: 'TU-001', name: 'Trục đường số 1', area: 'Khu vực 1', team: 'Tổ 1', load: [3.2, 2.9, 3.4]},

   2. TIỆN ÍCH
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const rnd = (a, b) => a + Math.random() * (b - a);
const hm = min => `${pad(Math.floor(min / 60) % 24)}:${pad(min % 60)}`;
const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
const fmtTime = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtClock = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const dayKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const num = (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? '—' : Number(v).toFixed(d);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3400); }
function inWindow(min, on, off) { return on > off ? (min >= on || min < off) : (min >= on && min < off); }
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const csvRow = r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',');
function copyText(txt, okMsg) {
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(okMsg), () => prompt('Chép nội dung:', txt));
}

/* =====================================================================
   3. ĐỒNG HỒ MÔ PHỎNG (chỉ dùng cho tủ giả lập)
   ===================================================================== */
const Clock = {
  ms: (() => { const d = new Date(); d.setHours(18, 40, 0, 0); return d.getTime(); })(),
  speed: 60,
  min() { const d = new Date(this.ms); return d.getHours() * 60 + d.getMinutes(); },
  jump(hms) { const [h, m, s] = hms.split(':').map(Number); const d = new Date(this.ms); d.setHours(h, m, s, 0); this.ms = d.getTime(); }
};

/* =====================================================================
   4. THIẾT BỊ GIẢ LẬP – cùng logic với firmware (applyOutputs / readInputs /
      readMeters / analyze / onMqttMessage)
   ===================================================================== */
class SimDevice {
  constructor(meta) {
    this.meta = meta; this.id = meta.id;
    this.f = {cut: [false, false, false], mains: false, kfail: [false, false], kstuck: [false, false], meter: false,
              door: false, cbTrip: false, spdFail: false, local: false, offline: false};
    this.sched = DEF_SCHED.map(s => s.slice());
    this.mode = 'auto'; this.maint = false;
    this.doState = this.sched.map((s, c) => this.schedOn(c));
    this.remoteDo = this.doState.slice();
    this.di = [0, 1, 0, 0, 1, 1];
    this.tick = Math.floor(Math.random() * CFG.TELE_EVERY);
    this.changedTick = -1000;
    const lit = this.doState.some(Boolean);
    this.loaded = [lit, lit, lit]; this.anyLoad = lit;
    this.ph = [0, 1, 2].map(() => ({v: 0, i: 0, p: 0, pf: 0, ok: true}));
    this.freq = 50; this.wh = rnd(2000, 9000) * 1000;
    this.tilt = rnd(0.2, 1.2); this.vib = 0; this.lastCollision = -1e9;
    this.meterFail = 0; this.alarms = {}; this.queue = []; this.offTicks = 0; this.lwtSent = false;
  }
  topic(leaf) { return `${App.root()}/tu/${this.id}/${leaf}`; }
  out(leaf, obj) {
    if (this.f.offline) { if (leaf === 'alarm') this.queue.push(obj); return; }
    Bus.fromDevice(this.topic(leaf), typeof obj === 'string' ? obj : JSON.stringify(obj), 'sim');
  }
  schedOn(c) { const s = this.sched[c]; return !!s[0] && inWindow(Clock.min(), s[1], s[2]); }
  applyOutputs() {
    let changed = false;
    for (let c = 0; c < N_DO; c++) {
      const want = this.mode === 'auto' ? this.schedOn(c) : this.remoteDo[c];
      if (want !== this.doState[c]) { this.doState[c] = want; changed = true; }
    }
    if (changed) { this.changedTick = this.tick; this.loaded = [false, false, false]; this.anyLoad = false; }
  }
  readInputs() {
    const f = this.f;
    this.di[DI.DOOR] = f.door ? 1 : 0;
    this.di[DI.CB] = f.cbTrip ? 0 : 1;
    this.di[DI.SPD] = f.spdFail ? 0 : 1;
    this.di[DI.AUTO] = f.local ? 0 : 1;
    for (let c = 0; c < 2; c++) this.di[FB_OF_DO[c]] = ((this.doState[c] || f.kstuck[c]) && !f.kfail[c]) ? 1 : 0;
  }
  readMeters() {
    const f = this.f, powered = !f.mains && this.di[DI.CB];
    let share = 0;
    for (let c = 0; c < N_DO; c++) { const closed = FB_OF_DO[c] >= 0 ? this.di[FB_OF_DO[c]] : this.doState[c]; if (closed) share += SIM_SHARE[c]; }
    for (let k = 0; k < 3; k++) {
      const p = this.ph[k];
      if (f.meter) { p.ok = false; continue; }
      p.ok = true;
      p.v = powered ? 225 + rnd(-2, 2) : rnd(0, 2);
      p.i = (powered && !f.cut[k]) ? this.meta.load[k] * share * (1 + rnd(-0.03, 0.03)) : rnd(0, 0.03);
      p.pf = p.i > 0.1 ? 0.95 + rnd(-0.01, 0.01) : 0;
      p.p = p.v * p.i * p.pf;
      this.wh += p.p * Clock.speed / 3600;
    }
    this.freq = powered ? 50 + rnd(-0.05, 0.05) : 0;
    this.meterFail = f.meter ? this.meterFail + 1 : 0;
  }
  send(code, phase, on, msg) {
    this.out('alarm', {id: this.id, code, phase, state: on ? 'on' : 'off', ts: Math.floor(Clock.ms / 1000), msg,
      v: this.ph.map(p => +p.v.toFixed(1)), i: this.ph.map(p => +p.i.toFixed(2))});
  }
  ev(key, code, phase, cond, need, msgOn, msgOff) {
    const a = this.alarms[key] || (this.alarms[key] = {cnt: 0, active: false});
    if (cond) { a.cnt++; if (!a.active && a.cnt >= need) { a.active = true; this.send(code, phase, true, msgOn); } }
    else { a.cnt = 0; if (a.active) { a.active = false; this.send(code, phase, false, msgOff); } }
  }
  analyze() {
    const ph = this.ph, di = this.di, settled = this.tick - this.changedTick > CFG.GRACE_TICKS;
    const localManual = !di[DI.AUTO], anyOn = this.doState.some(Boolean);
    this.ev('CB_TONG', 'CB_TONG', '-', !di[DI.CB], 2, 'CB tổng bị cắt/nhảy', 'CB tổng đã đóng');
    const allLost = ph.filter(p => p.ok && p.v < CFG.V_LOST).length === 3;
    this.ev('MAT_DIEN', 'MAT_DIEN', '-', allLost && di[DI.CB], CFG.DEBOUNCE_N, 'Mất điện lưới cả 3 pha', 'Đã có điện lại');
    for (let k = 0; k < 3; k++) this.ev('MAT_PHA' + k, 'MAT_PHA', 'ABC'[k], !allLost && ph[k].ok && ph[k].v < CFG.V_LOST, CFG.DEBOUNCE_N, 'Mất điện áp pha', 'Pha đã có điện áp');
    const vBad = ph.some(p => p.ok && p.v >= CFG.V_LOST && (p.v < CFG.V_MIN_OK || p.v > CFG.V_MAX_OK));
    this.ev('DIEN_AP', 'DIEN_AP', '-', vBad, CFG.VOLT_DEBOUNCE_N, 'Điện áp bất thường', 'Điện áp bình thường');
    const allVOk = ph.every(p => p.ok && p.v >= CFG.V_MIN_OK);
    for (let c = 0; c < 2; c++) {
      const fb = di[FB_OF_DO[c]];
      this.ev('KD' + c, 'K_KHONG_DONG', String(c + 1), !localManual && allVOk && this.doState[c] && !fb, CFG.FB_DEBOUNCE_N, 'Đã ra lệnh đóng nhưng contactor không đóng', 'Contactor đã đóng');
      this.ev('KC' + c, 'K_KHONG_CAT', String(c + 1), !localManual && !this.doState[c] && fb, CFG.FB_DEBOUNCE_N, 'Đã ra lệnh cắt nhưng contactor vẫn đóng', 'Contactor đã cắt');
    }
    for (let k = 0; k < 3; k++) {
      const vOk = ph[k].ok && ph[k].v >= CFG.V_MIN_OK;
      if (anyOn && ph[k].ok && ph[k].i >= CFG.I_LOADED) { this.loaded[k] = true; this.anyLoad = true; }
      this.ev('CAT' + k, 'CAT_CAP', 'ABC'[k], anyOn && this.loaded[k] && vOk && ph[k].i < CFG.I_ZERO, CFG.DEBOUNCE_N, 'Pha đang tải bị mất dòng, điện áp còn – nghi cắt/trộm cáp', 'Pha đã có dòng trở lại');
    }
    const iSum = ph.reduce((s, p) => s + (p.ok ? p.i : 0), 0);
    const fbOk = !this.alarms.KD0?.active && !this.alarms.KD1?.active;
    this.ev('KHONG_SANG', 'KHONG_SANG', '-', anyOn && settled && allVOk && fbOk && !this.anyLoad && iSum < CFG.I_ZERO * 3, CFG.DEBOUNCE_N, 'Contactor đã đóng nhưng không có dòng', 'Đèn đã sáng');
    this.ev('SANG_NGAY', 'SANG_NGAY', '-', !anyOn && !localManual && settled && iSum >= CFG.I_LOADED, CFG.DEBOUNCE_N, 'Tất cả kênh đã cắt nhưng vẫn có dòng', 'Đèn đã tắt');
    this.ev('SPD', 'SPD', '-', !di[DI.SPD], 2, 'Thiết bị chống sét hỏng', 'Chống sét bình thường');
    this.ev('CHE_DO_TAY', 'CHE_DO_TAY', '-', localManual, 2, 'Tủ đang ở chế độ Tay tại chỗ', 'Tủ đã về Tự động');
    this.ev('MO_CUA', 'MO_CUA', '-', di[DI.DOOR] && !this.maint, 2, 'Cửa tủ bị mở ngoài giờ bảo trì', 'Cửa tủ đã đóng');
    this.ev('LOI_DONG_HO', 'LOI_DONG_HO', '-', this.meterFail >= 5, 1, 'Không đọc được đồng hồ RS485', 'Đồng hồ đã phản hồi');
    if (this.vib > CFG.VIB_ALARM_G && this.tick - this.lastCollision > CFG.COLLISION_COOLDOWN_TICKS) {
      this.lastCollision = this.tick;
      this.send('VA_CHAM', '-', true, `Rung động mạnh ${this.vib.toFixed(2)}g – nghi xe va chạm`);
    }
    this.vib = 0;
    this.ev('NGHIENG', 'NGHIENG', '-', this.tilt > CFG.TILT_ALARM, CFG.DEBOUNCE_N, 'Tủ/trụ bị nghiêng', 'Đã hết nghiêng');
  }
  telemetry() {
    const ph = this.ph, ok = p => p.ok;
    this.out('telemetry', {id: this.id, ts: Math.floor(Clock.ms / 1000), f: +this.freq.toFixed(2), kwh: +(this.wh / 1000).toFixed(2),
      mode: this.mode, maint: this.maint ? 1 : 0, tilt: +this.tilt.toFixed(1), rssi: Math.round(rnd(-78, -55)), q: this.queue.length, sd: 1,
      v: ph.map(p => ok(p) ? +p.v.toFixed(1) : null), i: ph.map(p => ok(p) ? +p.i.toFixed(2) : null),
      p: ph.map(p => ok(p) ? +p.p.toFixed(1) : null), pf: ph.map(p => ok(p) ? +p.pf.toFixed(2) : null),
      di: this.di.slice(), do: this.doState.map(Number), sch: this.sched.map(s => s.slice())});
  }
  step() {
    this.tick++;
    this.readInputs(); this.applyOutputs(); this.readMeters(); this.analyze();
    if (this.f.offline) {
      if (++this.offTicks === CFG.LWT_AFTER && !this.lwtSent) { this.lwtSent = true; Bus.fromDevice(this.topic('status'), 'offline', 'sim'); }
    } else if (this.tick % CFG.TELE_EVERY === 0) this.telemetry();
  }
  setOffline(on) {
    this.f.offline = on;
    if (!on) {
      this.offTicks = 0; this.lwtSent = false;
      Bus.fromDevice(this.topic('status'), 'online', 'sim');
      const q = this.queue; this.queue = [];
      q.forEach(m => this.out('alarm', m));
      this.telemetry();
    }
  }
  // Cú pháp lệnh giống firmware: "<ref> <lệnh> <tham số>"
  onCmd(text) {
    if (this.f.offline) return;                  // mất mạng: lệnh không tới được tủ
    const m = text.trim().split(/\s+/), ref = +m[0], cmd = m[1], a = m.slice(2);
    let ok = true, msg = 'OK';
    const remoteCmd = ['do', 'all', 'mode'].includes(cmd);
    if (remoteCmd && !this.di[DI.AUTO]) { ok = false; msg = 'Tu dang o che do Tay tai cho'; }
    else if (cmd === 'do' || cmd === 'all') {
      const all = cmd === 'all', ch = all ? 0 : +a[0], val = +(all ? a[0] : a[1]);
      if ((!all && !(ch >= 1 && ch <= N_DO)) || Number.isNaN(val)) { ok = false; msg = 'Tham so sai'; }
      else {
        if (this.mode === 'auto') this.remoteDo = this.doState.slice();
        this.mode = 'remote';
        if (all) this.remoteDo = this.remoteDo.map(() => !!val); else this.remoteDo[ch - 1] = !!val;
      }
    } else if (cmd === 'mode') {
      if (a[0] === 'auto') this.mode = 'auto';
      else if (a[0] === 'remote') { this.remoteDo = this.doState.slice(); this.mode = 'remote'; }
      else { ok = false; msg = 'Che do sai'; }
    } else if (cmd === 'sched') {
      const t = /^\d{1,2}:\d{2}$/, ch = +a[0], en = +a[1];
      const on = t.test(a[2] || '') ? toMin(a[2]) : NaN, off = t.test(a[3] || '') ? toMin(a[3]) : NaN;
      if (ch >= 1 && ch <= N_DO && on >= 0 && on < 1440 && off >= 0 && off < 1440) this.sched[ch - 1] = [en ? 1 : 0, on, off];
      else { ok = false; msg = 'Lich sai'; }
    } else if (cmd === 'maint') this.maint = +a[0] !== 0;
    else if (cmd === 'status') { /* chỉ gửi lại số liệu */ }
    else if (cmd === 'sim') applySimFault(this, a[0], +a[1]);
    else { ok = false; msg = 'Lenh khong ho tro'; }
    this.readInputs(); this.applyOutputs();
    this.out('ack', {id: this.id, ref, ok: ok ? 1 : 0, msg});
    this.telemetry();
  }
}

/* =====================================================================
   5. BUS – thay cho broker MQTT khi chạy demo; ghi bản tin ra console
   ===================================================================== */
const Bus = {
  lines: [], dirty: false,
  fromDevice(topic, text, source) { this.log(topic, text); App.onMessage(topic, text, source); },
  log(topic, text) {
    const leaf = topic.split('/').pop();
    const cls = {alarm: 'a', status: 's', cmd: 'c', ack: 's'}[leaf] || '';
    this.lines.push(`<span class="t">${esc(fmtClock(Date.now()))} ${esc(topic)}</span> <span class="${cls}">${esc(text)}</span>`);
    if (this.lines.length > 200) this.lines.shift();
    this.dirty = true;
  },
  flush() {
    const c = $('#console'); if (!c || !this.dirty) return; this.dirty = false;
    const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 30;
    c.innerHTML = this.lines.join('\n');
    if (atBottom) c.scrollTop = c.scrollHeight;
  }
};

/* =====================================================================
   6. TRẠNG THÁI APP
   ===================================================================== */
const DEF_SETTINGS = {demo: true, teams: ['Tổ 1', 'Tổ 2', 'Tổ 3', 'Tổ trực đêm'], pinHash: '',
  mq: {url: 'wss://broker.hivemq.com:8884/mqtt', root: 'cs/demo-doi-cs', user: '', pass: '', auto: false}};
const savedSettings = store.get('gst.settings', {});
const App = {
  settings: Object.assign({}, DEF_SETTINGS, savedSettings, {mq: Object.assign({}, DEF_SETTINGS.mq, savedSettings.mq || {})}),
  cabCfg: store.get('gst.cabs', null),
  incidents: store.get('gst.inc', []),
  seq: store.get('gst.seq', 0),
  energy: store.get('gst.energy', {}),
  cabs: {}, devices: {}, pending: {}, sel: new Set(), area: '', incFilter: 'open', incDirty: true, bulkCh: 'all',
  mq: null, mqState: 'off', unlockedUntil: 0, random: false, randomTimer: 0, simCab: 'TU-001', sound: false,

  root() { return (this.settings.mq.root || 'cs/demo').trim(); },
  saveSettings() { store.set('gst.settings', this.settings); },
  saveCabs() { store.set('gst.cabs', this.cabCfg); },
  saveInc() { store.set('gst.inc', this.incidents.slice(-800)); store.set('gst.seq', this.seq); },
  saveEnergy() { store.set('gst.energy', this.energy); },

  init() {
    if (!Array.isArray(this.cabCfg)) {
      this.cabCfg = SAMPLE.map(m => ({key: 'sim:' + m.id, id: m.id, source: 'sim', name: m.name, area: m.area, team: m.team,
        doNames: DEF_DO.slice(), diNames: DEF_DI.slice()}));
      this.saveCabs();
    }
    this.cabCfg.forEach(cfg => this.addRuntime(cfg));
    SAMPLE.forEach(m => { this.devices[m.id] = new SimDevice(m); });
    if (this.settings.demo) Object.values(this.devices).forEach(d => { d.readInputs(); d.readMeters(); d.telemetry(); });
  },
  addRuntime(cfg) {
    this.cabs[cfg.key] = {cfg, tele: null, online: true, lastSeen: Date.now(), hist: [], active: {}, log: []};
    return this.cabs[cfg.key];
  },
  visibleCabs() { return Object.values(this.cabs).filter(c => c.cfg.source !== 'sim' || this.settings.demo); },
  ensureCab(source, id) {
    const key = source + ':' + id;
    if (this.cabs[key]) return this.cabs[key];
    const cfg = {key, id, source, name: 'Tủ ' + id, area: 'Chưa phân khu', team: this.settings.teams[0] || 'Tổ 1', doNames: DEF_DO.slice(), diNames: DEF_DI.slice()};
    this.cabCfg.push(cfg); this.saveCabs();
    return this.addRuntime(cfg);
  },
  nowFor(cab) { return cab && cab.cfg.source === 'sim' ? Clock.ms : Date.now(); },
  addLog(cab, s, t) { cab.log.unshift({t: t || this.nowFor(cab), s}); if (cab.log.length > 200) cab.log.pop(); },

  /* ---------- Bản tin từ thiết bị ---------- */
  onMessage(topic, text, source) {
    const parts = topic.split('/'); if (parts.length < 3) return;
    const leaf = parts.pop(), id = parts.pop();
    if (source === 'sim' && !this.settings.demo) return;
    const cab = this.ensureCab(source, id);
    if (leaf === 'status') { if (text === 'offline') this.markOffline(cab, 'Broker báo thiết bị mất kết nối'); else this.markOnline(cab); return; }
    if (leaf === 'cmd') { if (!this.pending[text.split(' ')[0]]) this.addLog(cab, `Lệnh từ thiết bị khác: ${text}`); return; }
    let m; try { m = JSON.parse(text); } catch (e) { return; }
    cab.lastSeen = Date.now();
    if (!cab.online) this.markOnline(cab);
    if (leaf === 'telemetry') this.onTelemetry(cab, m);
    else if (leaf === 'alarm') this.onAlarm(cab, m);
    else if (leaf === 'ack') this.onAck(cab, m);
  },
  onTelemetry(cab, m) {
    cab.tele = m;
    const t = m.ts ? m.ts * 1000 : this.nowFor(cab);
    cab.hist.push({t, v: m.v || [], i: m.i || [], p: (m.p || []).reduce((s, x) => s + (x || 0), 0)});
    if (cab.hist.length > CFG.HIST) cab.hist.shift();
    if (typeof m.kwh === 'number') {
      const e = this.energy[cab.cfg.key] || (this.energy[cab.cfg.key] = {});
      if (!Object.keys(e).length && cab.cfg.source === 'sim') seedEnergy(e, m.kwh, cab, t);
      const d = dayKey(t);
      if (!e[d]) e[d] = [m.kwh, m.kwh]; else e[d][1] = m.kwh;
      this.energyDirty = true;
    }
  },
  markOffline(cab, why) { if (!cab.online) return; cab.online = false; this.onAlarm(cab, {code: 'MAT_KET_NOI', phase: '-', state: 'on', msg: why, ts: 0}); },
  markOnline(cab) { if (cab.online) return; cab.online = true; cab.lastSeen = Date.now(); this.onAlarm(cab, {code: 'MAT_KET_NOI', phase: '-', state: 'off', msg: 'Thiết bị kết nối lại', ts: 0}); },

  onAlarm(cab, m) {
    const info = ALARM[m.code]; if (!info) return;
    const at = m.ts ? m.ts * 1000 : this.nowFor(cab);
    const phase = m.phase && m.phase !== '-' ? m.phase : null;
    const akey = m.code + (phase || '');
    if (m.state === 'on') cab.active[akey] = m.code === 'VA_CHAM' ? {...m, exp: Date.now() + 60000} : m;
    else delete cab.active[akey];
    this.addLog(cab, `${m.state === 'on' ? '⚠️' : '✅'} ${info.label}${phase ? ' ' + phaseLabel(m.code, phase) : ''}: ${m.msg}`, at);
    let inc = this.incidents.find(x => x.cab === cab.cfg.key && x.code === m.code && x.status !== 'done');
    const iTxt = m.i && /^[ABC]$/.test(phase || '') ? ` (I=${m.i['ABC'.indexOf(phase)]} A, U=${m.v['ABC'.indexOf(phase)]} V)` : '';
    if (m.state === 'on') {
      if (inc) {
        inc.count++; inc.cleared = false;
        if (phase && !inc.phases.includes(phase)) inc.phases.push(phase);
        if (phase && !inc.activePh.includes(phase)) inc.activePh.push(phase);
        inc.log.push({t: at, s: `Thiết bị báo lại${phase ? ' ' + phaseLabel(m.code, phase) : ''}${iTxt}`});
      } else {
        inc = {no: 'SC-' + String(++this.seq).padStart(4, '0'), cab: cab.cfg.key, tu: cab.cfg.id, name: cab.cfg.name, area: cab.cfg.area,
          code: m.code, phases: phase ? [phase] : [], activePh: phase ? [phase] : [], at, status: 'new', team: cab.cfg.team,
          note: '', count: 1, cleared: false, log: [{t: at, s: `Phát hiện: ${m.msg}${iTxt}`}]};
        this.incidents.push(inc);
        toast(`${info.icon} ${cab.cfg.id}: ${info.label}${phase ? ' – ' + phaseLabel(m.code, phase) : ''}`);
        if (info.sev >= 3) this.alert();
      }
    } else if (inc) {
      if (phase) inc.activePh = inc.activePh.filter(p => p !== phase);
      if (!phase || !inc.activePh.length) { inc.cleared = true; inc.log.push({t: at, s: `Thiết bị báo đã hết: ${m.msg}`}); }
    }
    this.saveInc(); this.incDirty = true;
  },
  onAck(cab, m) {
    const p = this.pending[m.ref]; if (!p || p.key !== cab.cfg.key) return;
    clearTimeout(p.timer); delete this.pending[m.ref];
    const msg = ACK_MSG[m.msg] || m.msg;
    this.addLog(cab, `${m.ok ? '✔' : '✖'} ${p.label} – ${msg}`);
    p.resolve({ok: !!m.ok, msg});
  },
  alert() {
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    if (!this.sound || !this.ac) return;
    try { const o = this.ac.createOscillator(), g = this.ac.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(this.ac.destination); o.start(); o.stop(this.ac.currentTime + 0.35); } catch (e) {}
  },

  /* ---------- Gửi lệnh: chờ tủ xác nhận (ack) hoặc hết giờ ---------- */
  send(cab, body, label) {
    const ref = String(Date.now() % 1e9 + Math.floor(Math.random() * 1000));
    const text = `${ref} ${body}`, topic = `${this.root()}/tu/${cab.cfg.id}/cmd`;
    return new Promise(resolve => {
      if (cab.cfg.source === 'mqtt' && !(this.mq && this.mq.connected)) { resolve({ok: false, msg: 'App chưa kết nối broker'}); return; }
      this.pending[ref] = {key: cab.cfg.key, label, resolve, timer: setTimeout(() => {
        delete this.pending[ref];
        this.addLog(cab, `✖ ${label} – tủ không phản hồi`);
        resolve({ok: false, msg: 'Tủ không phản hồi (mất kết nối?)'});
      }, CFG.CMD_TIMEOUT_MS)};
      this.addLog(cab, `➜ Gửi lệnh: ${label}`);
      Bus.log(topic, text);
      if (cab.cfg.source === 'sim') setTimeout(() => this.devices[cab.cfg.id].onCmd(text), 250 + Math.random() * 300);
      else this.mq.publish(topic, text, {qos: 1});
    });
  },
  pendingFor(key, match) { return Object.values(this.pending).some(p => p.key === key && (!match || p.label.includes(match))); },

  cabState(cab) {
    if (!cab.online) return 'off';
    const sev = Object.values(cab.active).map(a => ALARM[a.code]?.sev || 1);
    if (!sev.length) return 'ok';
    return Math.max(...sev) >= 3 ? 'bad' : 'warn';
  }
};

function phaseLabel(code, ph) { return code.startsWith('K_') ? 'K' + ph : 'pha ' + ph; }
function modeInfo(t) {
  if (!t) return {txt: 'Chưa có dữ liệu', cls: ''};
  if (t.di && t.di[DI.AUTO] === 0) return {txt: '✋ Tay tại chỗ', cls: 'warn'};
  return t.mode === 'remote' ? {txt: '📱 Điều khiển từ xa', cls: 'acc'} : {txt: '🕒 Tự động theo lịch', cls: 'ok'};
}
function seedEnergy(e, kwhNow, cab, t) {            // dữ liệu mẫu 30 ngày trước cho tủ demo
  const load = (App.devices[cab.cfg.id]?.meta.load || [3, 3, 3]).reduce((a, b) => a + b, 0);
  const daily = load * 0.225 * 0.95 * (0.6 * 11.5 + 0.3 * 5 + 0.1 * 3.5);
  const hrs = new Date(t).getHours() + new Date(t).getMinutes() / 60;
  // phần đã dùng từ 0h: rạng sáng (đến 5:30) ~ 45% điện năng ngày, tối (từ 18:00) phần còn lại
  const usedToday = daily * (Math.min(hrs, 5.5) / 5.5 * 0.45 + (hrs >= 18 ? (hrs - 18) / 6 * 0.55 : 0));
  e[dayKey(t)] = [+(kwhNow - usedToday).toFixed(2), kwhNow];
  let end = kwhNow - usedToday;
  for (let d = 1; d <= 30; d++) {
    const k = dayKey(t - d * 86400000), used = daily * rnd(0.9, 1.08);
    e[k] = [+(end - used).toFixed(2), +end.toFixed(2)]; end -= used;
  }
}
function energyStats(key, nowMs) {
  const e = App.energy[key] || {}, today = dayKey(nowMs), month = today.slice(0, 7);
  const used = k => e[k] ? Math.max(0, e[k][1] - e[k][0]) : 0;
  const days = [];
  for (let d = 13; d >= 0; d--) { const k = dayKey(nowMs - d * 86400000); days.push({k, v: used(k)}); }
  const monthSum = Object.keys(e).filter(k => k.startsWith(month)).reduce((s, k) => s + used(k), 0);
  const past = days.slice(0, -1).filter(d => d.v > 0);
  return {today: used(today), month: monthSum, days, avg: past.length ? past.reduce((s, d) => s + d.v, 0) / past.length : 0};
}

function openModal(html) { $('#modal').innerHTML = html; $('#modal').classList.add('on'); $('#modalBg').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); $('#modalBg').classList.remove('on'); if (closeModal.cb) { const cb = closeModal.cb; closeModal.cb = null; cb(); } }
$('#modalBg').onclick = closeModal;
function confirmAction(title, body, okLabel = 'Thực hiện') {
  const needPin = App.settings.pinHash && Date.now() > App.unlockedUntil;
  return new Promise(resolve => {
    openModal(`<h2>${esc(title)}</h2><div class="sub" style="font-size:14px">${body}</div>
      ${needPin ? '<div class="field" style="margin-top:12px"><label for="pinIn">Mã PIN điều khiển</label><input id="pinIn" class="in" type="password" inputmode="numeric" autocomplete="off"></div>' : ''}
      <div class="btns"><button class="btn" id="mNo">Huỷ</button><button class="btn pri" id="mYes">${esc(okLabel)}</button></div>`);
    closeModal.cb = () => resolve(false);
    const pinIn = $('#pinIn'); if (pinIn) pinIn.focus();
    $('#mNo').onclick = closeModal;
    $('#mYes').onclick = () => {
      if (needPin) {
        if (hash(pinIn.value) !== App.settings.pinHash) { toast('Sai mã PIN'); pinIn.value = ''; return; }
        App.unlockedUntil = Date.now() + CFG.PIN_UNLOCK_MS;

  const label = action === 'auto' ? 'Về tự động theo lịch' : `${action === '1' ? 'Bật' : 'Tắt'} ${chName}`;
  if (!await confirmAction(`${label} cho ${keys.length} tủ?`, keys.map(k => esc(App.cabs[k].cfg.id)).join(', '))) return;
  toast(`Đang gửi lệnh tới ${keys.length} tủ…`);

  const res = await Promise.all(keys.map(k => App.send(App.cabs[k], body, label).then(r => ({k, ...r}))));

  toast(`${label}: ${res.length - fail.length}/${res.length} tủ đã thực hiện${fail.length ? ' · không được: ' + fail.map(f => App.cabs[f.k].cfg.id).join(', ') : ''}`);

function dailyReport() {

  const by = (arr, fn) => arr.reduce((m, x) => (m[fn(x)] = (m[fn(x)] || 0) + 1, m), {});
  const open = App.incidents.filter(x => x.status !== 'done');
  const kwh = App.visibleCabs().reduce((s, c) => s + energyStats(c.cfg.key, App.nowFor(c)).today, 0);
  let r = `BÁO CÁO NGÀY ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}\n`;
  r += `Sự cố phát sinh: ${today.length} · Đã xong: ${today.filter(x => x.status === 'done').length}\n\n`;
  r += 'Theo loại:\n' + (Object.entries(by(today, x => ALARM[x.code].label)).map(([a, v]) => `  • ${a}: ${v}`).join('\n') || '  (không có)') + '\n\n';
  r += 'Theo tổ:\n' + (Object.entries(by(today, x => x.team)).map(([a, v]) => `  • ${a}: ${v}`).join('\n') || '  (không có)') + '\n\n';
  r += `Điện năng tiêu thụ hôm nay (đến hiện tại): ${kwh.toFixed(1)} kWh\n\n`;
  r += `Tồn chưa xong: ${open.length}\n` + open.map(x => `  • ${x.no} ${x.tu} – ${ALARM[x.code].label} – ${x.team} – ${STATUS[x.status]}`).join('\n');

}

function simFaultOn(d, k) {
  if (k.startsWith('cut')) return d.f.cut['ABC'.indexOf(k[3])];
  if (k.startsWith('kfail')) return d.f.kfail[+k[5] - 1];
  if (k.startsWith('kstuck')) return d.f.kstuck[+k[6] - 1];
  if (k === 'crash') return d.tilt > CFG.TILT_ALARM;
  return !!d.f[k];
}
function applySimFault(d, k, on) {
  on = !!on;
  if (!k) return;
  if (k.startsWith('cut')) d.f.cut['ABC'.indexOf(k[3])] = on;
  else if (k.startsWith('kfail')) d.f.kfail[+k[5] - 1] = on;
  else if (k.startsWith('kstuck')) d.f.kstuck[+k[6] - 1] = on;
  else if (k === 'crash') { if (on) { d.vib = rnd(1.2, 2.5); d.tilt = 22 + rnd(0, 6); } else d.tilt = rnd(0.2, 1.2); }
  else if (k === 'offline') d.setOffline(on);
  else if (k in d.f) d.f[k] = on;
}

/* ---------- Biểu đồ ---------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  return {ctx, w, h};
}
function lineChart(id, series, colors, fixedMin) {
  const cv = document.getElementById(id); if (!cv) return;
  const {ctx, w, h} = setupCanvas(cv), L = 40, T = 10, B = 18;
  const all = series.flat().filter(x => x !== null && x !== undefined);
  let lo = fixedMin ?? (all.length ? Math.min(...all) : 0), hi = all.length ? Math.max(...all) : 1;
  if (hi - lo < 1) { hi += 1; lo = Math.max(0, lo - 1); }
  hi += (hi - lo) * 0.1;
  ctx.font = '11px system-ui'; ctx.fillStyle = cssVar('--muted'); ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 1;
  for (let g = 0; g <= 3; g++) {
    const y = T + (h - T - B) * g / 3, val = hi - (hi - lo) * g / 3;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - 6, y); ctx.stroke();
    ctx.fillText(val.toFixed(hi < 10 ? 1 : 0), 4, y + 4);
  }
  ctx.fillText('10 phút trước', L, h - 4); ctx.textAlign = 'right'; ctx.fillText('bây giờ', w - 6, h - 4); ctx.textAlign = 'left';
  series.forEach((s, k) => {
    ctx.strokeStyle = colors[k]; ctx.lineWidth = 2; ctx.beginPath(); let started = false;
    s.forEach((v, n) => {
      if (v === null || v === undefined) { started = false; return; }
      const x = L + (w - 6 - L) * n / Math.max(1, CFG.HIST - 1), y = T + (h - T - B) * (1 - (v - lo) / (hi - lo));
      if (started) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      started = true;
    });
    ctx.stroke();
  });
}
function barChart(id, labels, values) {
  const cv = document.getElementById(id); if (!cv) return;
  const {ctx, w, h} = setupCanvas(cv), L = 36, T = 16, B = 20;
  const hi = Math.max(1, ...values) * 1.15, bw = (w - L - 6) / values.length;
  ctx.font = '11px system-ui'; ctx.fillStyle = cssVar('--muted'); ctx.strokeStyle = cssVar('--line');
  for (let g = 0; g <= 2; g++) { const y = T + (h - T - B) * g / 2; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - 6, y); ctx.stroke(); ctx.fillText((hi - hi * g / 2).toFixed(0), 4, y + 4); }
  values.forEach((v, n) => {
    const bh = (h - T - B) * v / hi, x = L + n * bw + bw * 0.18, y = h - B - bh;
    ctx.fillStyle = n === values.length - 1 ? cssVar('--warn') : cssVar('--accent');
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, bw * 0.64, bh, [4, 4, 0, 0]); else ctx.rect(x, y, bw * 0.64, bh);
    ctx.fill();
    if ((values.length - 1 - n) % 2 === 0) { ctx.fillStyle = cssVar('--muted'); ctx.textAlign = 'center'; ctx.fillText(labels[n], x + bw * 0.32, h - 5); ctx.textAlign = 'left'; }
  });
}

function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  if (!p[0]) return {r: 'home', live: true};
  if (p[0] === 'tu' && p[1]) { const tab = TABS.some(t => t[0] === p[2]) ? p[2] : 'do-luong'; return {r: 'tu', key: p[1], tab, live: tab !== 'lich'}; }
  if (p[0] === 'tu') return {r: 'tu', live: true};
  if (p[0] === 'dieu-khien') return {r: 'dieu-khien', live: true};
  if (p[0] === 'canh-bao') return {r: 'canh-bao', live: false};
  if (p[0] === 'cai-dat') return {r: 'cai-dat', live: false};
  return {r: 'home', live: true};
}
let lastRouteKey = null;
function render(force) {
  const R = route(), rk = location.hash;
  const changed = rk !== lastRouteKey;
  const ae = document.activeElement;
  const typing = ae && $('#main').contains(ae) && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ae.tagName);
  const modalOpen = $('#modal').classList.contains('on');
  const doRender = force || changed || (!typing && !modalOpen && (R.live || (R.r === 'canh-bao' && App.incDirty)));
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === R.r));
  const openN = App.incidents.filter(x => x.status === 'new').length, bd = $('#incBadge');
  bd.hidden = !openN; bd.textContent = openN;
  if (!doRender) return;
  if (R.r === 'canh-bao') App.incDirty = false;
  const html = R.r === 'home' ? viewHome() : R.r === 'tu' ? (R.key ? viewCab(R.key, R.tab) : viewCabList())
    : R.r === 'dieu-khien' ? viewControl() : R.r === 'canh-bao' ? viewAlerts() : viewSettings();
  $('#main').innerHTML = html;
  if (changed) { window.scrollTo(0, 0); lastRouteKey = rk; }
  if (R.r === 'tu' && R.key && App.cabs[R.key]) {
    const cab = App.cabs[R.key], colors = [cssVar('--pa'), cssVar('--pb'), cssVar('--pc')];
    if (R.tab === 'do-luong') {
      const fill = arr => Array(Math.max(0, CFG.HIST - arr.length)).fill(null).concat(arr);
      lineChart('chI', [0, 1, 2].map(k => fill(cab.hist.map(h => h.i[k]))), colors, 0);
      lineChart('chV', [0, 1, 2].map(k => fill(cab.hist.map(h => h.v[k]))), colors);
    }
    if (R.tab === 'dien-nang') {
      const st = energyStats(R.key, App.nowFor(cab));
      barChart('chE', st.days.map(d => d.k.slice(8) + '/' + d.k.slice(5, 7)), st.days.map(d => d.v));
    }
  }
  Bus.dirty = true; Bus.flush();
}

      const cab = App.cabs[key], e2 = App.energy[key] || {};

      const sev = {3: 'Khẩn', 2: 'Cao', 1: 'Thường'};

      download(`su-co-${dayKey(Date.now())}.csv`, '\ufeff' + [head, ...rows].map(csvRow).join('\r\n'), 'text/csv;charset=utf-8');

    }
    case 'pin-clear': if (await confirmAction('Bỏ mã PIN?', 'Lệnh điều khiển sẽ không hỏi PIN nữa.')) { App.settings.pinHash = ''; App.saveSettings(); render(true); } break;
    case 'teams': { const t = $('#teams').value.split('\n').map(s => s.trim()).filter(Boolean); if (t.length) { App.settings.teams = t; App.saveSettings(); toast('Đã lưu tổ đội'); } break; }

function incAction(op, no) {
  const x = App.incidents.find(i => i.no === no); if (!x) return;
  const now = App.nowFor(App.cabs[x.cab]);
  if (op === 'zalo') { copyText(zaloText(x), 'Đã chép – dán vào nhóm Zalo'); return; }
  if (op === 'assign') { x.status = 'assigned'; x.log.push({t: now, s: `Giao cho ${x.team}`}); toast(`${x.no} đã giao cho ${x.team}`); }
  if (op === 'doing') { x.status = 'doing'; x.log.push({t: now, s: `${x.team} đang xử lý`}); }
  if (op === 'done') {
    const note = prompt('Ghi chú kết quả xử lý (VD: đã nối lại 30m cáp, đã báo CA phường):', x.note || '');
    if (note === null) return;
    x.note = note; x.status = 'done'; x.log.push({t: now, s: `Hoàn thành${note ? ': ' + note : ''}`});
  }
  if (op === 'reopen') { x.status = 'assigned'; x.log.push({t: now, s: 'Mở lại'}); }
  App.saveInc(); render(true);
}

/* ---------- MQTT thật ---------- */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
function setMq(state) { App.mqState = state; updateHeader(); if (route().r === 'cai-dat') render(true); }
async function mqToggle() {
  if (App.mq) { App.mq.end(true); App.mq = null; setMq('off'); return; }
  const mq = App.settings.mq;
  if ($('#mqUrl')) { mq.url = $('#mqUrl').value.trim(); mq.root = $('#mqRoot').value.trim(); mq.user = $('#mqUser').value; mq.pass = $('#mqPass').value; mq.auto = $('#mqAuto').checked; App.saveSettings(); }
  try {
    setMq('loading');
    if (!window.mqtt) await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js');
    setMq('connecting');
    const root = App.root();
    App.mq = window.mqtt.connect(mq.url, {clientId: 'app-' + Math.random().toString(16).slice(2, 10), username: mq.user || undefined, password: mq.pass || undefined, reconnectPeriod: 5000, connectTimeout: 10000});
    App.mq.on('connect', () => { App.mq.subscribe(root + '/tu/+/+'); setMq('on'); });
    App.mq.on('message', (topic, buf) => { const text = buf.toString(); Bus.log(topic, text); App.onMessage(topic, text, 'mqtt'); });
    App.mq.on('error', () => setMq('err'));
    App.mq.on('offline', () => setMq('retry'));
  } catch (err) { App.mq = null; setMq('err'); toast('Không tải được thư viện MQTT (kiểm tra mạng)'); }
}
function updateHeader() {
  const dot = $('#connDot'), txt = $('#connTxt');
  if (App.mq && App.mqState === 'on') { dot.className = 'dot ok'; txt.textContent = 'MQTT'; }
  else if (App.mq) { dot.className = 'dot warn'; txt.textContent = 'MQTT…'; }
  else { dot.className = 'dot' + (App.settings.demo ? ' ok' : ''); txt.textContent = App.settings.demo ? 'Demo' : 'Ngoại tuyến'; }
  $('#clockChip').style.display = App.settings.demo ? '' : 'none';
  $('#hsub').textContent = App.settings.demo ? 'App cá nhân · đang chạy Demo' : 'App cá nhân';
}

/* =====================================================================
   11. VÒNG LẶP 1 GIÂY
   ===================================================================== */
let energySaveTick = 0;
function loop() {
  if (App.settings.demo) {
    Clock.ms += 1000 * Clock.speed;
    const d = new Date(Clock.ms);
    $('#simTime').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    $('#dayIcon').textContent = inWindow(Clock.min(), 1080, 330) ? '🌙' : '☀️';
    Object.values(App.devices).forEach(dev => dev.step());
    if (App.random && --App.randomTimer <= 0) {
      App.randomTimer = Math.round(rnd(25, 45));
      const devs = Object.values(App.devices), dev = devs[Math.floor(Math.random() * devs.length)];
      const pool = ['cutA', 'cutB', 'cutC', 'crash', 'door', 'mains', 'offline', 'kfail1', 'cbTrip'];
      const k = pool[Math.floor(Math.random() * pool.length)];
      applySimFault(dev, k, true);
      setTimeout(() => applySimFault(dev, k, false), rnd(40, 90) * 1000);
    }
  }
  const now = Date.now();
  App.visibleCabs().forEach(c => {
    Object.keys(c.active).forEach(k => { if (c.active[k].exp && c.active[k].exp < now) delete c.active[k]; });
    if (c.online && c.tele && now - c.lastSeen > CFG.OFFLINE_AFTER_S * 1000) App.markOffline(c, `Không nhận được dữ liệu quá ${CFG.OFFLINE_AFTER_S} giây`);
  });
  if (App.energyDirty && ++energySaveTick >= 30) { energySaveTick = 0; App.energyDirty = false; App.saveEnergy(); }
  updateHeader();
  render(false);
  Bus.flush();
}

/* ---------- Khởi động ---------- */
App.init();
updateHeader();
render(true);
setInterval(loop, 1000);
if (App.settings.mq.auto) mqToggle();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
