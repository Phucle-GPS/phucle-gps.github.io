      this.P.posts.push({head, cone, ch, ph});
    }
    this.anchors.den = new T.Vector3(1.9 + 2 * 1.45, 3.45, 1.7);
    this.buildFlow(PH, wx);
    // Cây trang trí (K3)
    this.add(new T.ConeGeometry(0.35, 1.0, 10), '#2f6b3a', -1.2, 0.75, 1.2, S, 'den');
    this.box(0.08, 0.3, 0.08, '#6b4a2b', -1.2, 0.15, 1.2, S, 'den');
    this.P.garland = [];
    for (let n = 0; n < 9; n++) {
      const a = n * 1.9, h = 0.35 + n * 0.08, r = 0.33 - n * 0.032;
      const b = this.add(new T.SphereGeometry(0.025, 8, 8), '#555', -1.2 + Math.cos(a) * r, h, 1.2 + Math.sin(a) * r, S, null, {emissive: '#000'});
      this.P.garland.push(b);
    }

    // ---- Cửa tủ (bản lề bên trái) ----
    const door = this.door = new T.Group(); door.position.set(-0.6, 1.0, 0.226); G.add(door);
    this.P.doorPanel = this.box(1.2, 1.6, 0.02, '#c9cfd6', 0.6, 0, 0.01, door, 'door', {transparent: true});
    this.box(0.04, 0.16, 0.03, '#33383f', 1.1, 0, 0.035, door, 'door');
    this.label(`${cab.cfg.id} · TỦ ĐIỀU KHIỂN CHIẾU SÁNG`, 0.95, 0.1, door, 0.6, 0.62, 0.022, {bg: '#ffffff', fg: '#17212b', size: 0.42});
    this.label('⚡ NGUY HIỂM ĐIỆN CAO ÁP', 0.6, 0.08, door, 0.6, 0.46, 0.022, {bg: '#f2b705', fg: '#17212b', size: 0.5});
    this.P.pilots = [0, 1, 2].map(k => this.add(new T.SphereGeometry(0.03, 12, 12), PH[k], 0.42 + k * 0.18, 0.28, 0.035, door, null, {emissive: PH[k], emissiveIntensity: 0.9}));
    const sw = this.P.selector = new T.Group(); sw.position.set(0.6, 0.05, 0.04); door.add(sw);
    this.add(new T.CylinderGeometry(0.06, 0.06, 0.03, 20), '#222', 0, 0, 0, sw, 'selector').rotation.x = Math.PI / 2;
    this.box(0.025, 0.1, 0.03, '#d63a3a', 0, 0, 0.025, sw, 'selector');
    this.label('TAY      TỰ ĐỘNG', 0.32, 0.05, door, 0.6, 0.15, 0.022, {fg: '#17212b', size: 0.6});
    this.doorAngle = 0;
    this.P.doorDecor = door.children.filter(c => c !== this.P.doorPanel);

    // Nhãn cảnh báo nổi
    SEGS.forEach(s => {
      const m = this.sprite(segName(cab, s.id).replace('Contactor ', ''), '#d63a3a', 0.042);
      m.userData.seg = s.id; m.visible = false; S.add(m); this.markers[s.id] = m;
    });
    this.needHome = true;
  },

  /* ---------- Dòng điện chạy trong dây ----------
     Mỗi đoạn dây là một "luồng": hạt sáng chạy từ nguồn về tải.
     Tốc độ và mật độ hạt tỉ lệ với dòng điện đo được (A). */
  glowTex() {
    if (this._glow) return this._glow;
    const t = this.canvasTex(64, 64, g => {
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,.85)'); r.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    });
    return (this._glow = t.tex);
  },
  buildFlow(PH, wx) {
    const T = THREE, V = a => new T.Vector3(...a);
    const curveOf = pts => new T.CatmullRomCurve3(pts.map(V), false, 'catmullrom', 0.1);
    this.flows = []; this.showFlow = this.showFlow !== false;
    const add = (curve, inCab, color, getI, speed, dens) => {
      const len = curve.getLength(), n = Math.max(4, Math.min(60, Math.round(len * dens)));
      this.flows.push({curve, inCab, col: new T.Color(color), getI, speed, len, n, ph: Math.random()});
    };
    // Lưới → CB, CB → CT → thanh cái (3 pha)
    [0, 1, 2].forEach(k => {
      add(this.P.inCable[k].userData.curve, true, PH[k], c => c.vOk[k] ? c.i[k] : 0, 1.6, 9);
      add(this.P.mid[k].userData.curve, true, PH[k], c => c.i[k], 1, 24);
    });
    // Thanh cái → qua contactor → hàng kẹp (dòng mỗi kênh: ước tính theo tỉ lệ tải)
    this.P.kx.forEach((x, c) => add(curveOf([[x, 1.07 + 0.044, -0.1], [x, 1.03, -0.06], [x, 0.9, -0.035], [x, 0.8, -0.06], [x, 0.7, -0.09], [x, 0.62, -0.08], [(c - 1.5) * 0.12, 0.52, -0.08]]),
      true, '#ffe08a', ctx => ctx.kI[c], 1, 26));
    // Cáp ra đường: trước và sau điểm nghi cắt
    [0, 1, 2].forEach(k => {
      add(this.P.outA[k].userData.curve, false, PH[k], c => c.i[k], 3.2, 3.2);
      add(this.P.outB[k].userData.curve, false, PH[k], c => c.cut[k] ? 0 : c.i[k], 3.2, 2.6);
    });
    // Từ cáp ngầm leo lên cột tới bóng đèn
    this.P.posts.forEach((p, n) => {
      const x = 1.9 + n * 1.45, z = 0.85 + p.ph * 0.08;
      add(curveOf([[x, 0.03, z], [x + 0.05, 0.04, 1.3], [x + 0.05, 0.4, 1.33], [x + 0.05, 2.85, 1.33], [x, 2.99, 1.55], [x, 2.95, 1.76]]),
        false, PH[p.ph], ctx => ctx.postI[n], 2.2, 3.5);
    });
    const mk = (inCab, size) => {
      const list = this.flows.filter(f => f.inCab === inCab); let off = 0;
      list.forEach(f => { f.off = off; off += f.n; });
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(new Float32Array(off * 3), 3));
      geo.setAttribute('color', new T.BufferAttribute(new Float32Array(off * 3), 3));
      const pts = new T.Points(geo, new T.PointsMaterial({size, map: this.glowTex(), vertexColors: true, transparent: true, depthWrite: false, blending: T.AdditiveBlending}));
      pts.frustumCulled = false; pts.renderOrder = 5;
      (inCab ? this.cabG : this.scene).add(pts);
      list.forEach(f => { f.geo = geo; });
      return pts;
    };
    mk(true, 0.032); mk(false, 0.1);
    // Tia lửa tại điểm nghi cắt cáp
    const NS = 48, sg = new T.BufferGeometry();
    sg.setAttribute('position', new T.BufferAttribute(new Float32Array(NS * 3), 3));
    sg.setAttribute('color', new T.BufferAttribute(new Float32Array(NS * 3), 3));
    const sp = new T.Points(sg, new T.PointsMaterial({size: 0.07, map: this.glowTex(), vertexColors: true, transparent: true, depthWrite: false, blending: T.AdditiveBlending}));
    sp.frustumCulled = false; this.scene.add(sp);
    this.sparks = {geo: sg, p: Array.from({length: NS}, () => ({x: 0, y: -9, z: 0, vx: 0, vy: 0, vz: 0, life: 0}))};
    // Nhãn số ampe trên cáp ra
    this.P.ampTags = [0, 1, 2].map(k => {
      const t = this.canvasTex(320, 80, (g, W, H, txt) => {
        g.clearRect(0, 0, W, H); g.fillStyle = 'rgba(12,18,28,.82)';
        g.beginPath(); if (g.roundRect) g.roundRect(2, 2, W - 4, H - 4, 22); else g.rect(2, 2, W - 4, H - 4); g.fill();
        g.fillStyle = PH[k]; g.beginPath(); g.arc(38, H / 2, 14, 0, 7); g.fill();
        g.fillStyle = '#fff'; g.font = '700 38px system-ui'; g.textBaseline = 'middle'; g.fillText(txt || `Pha ${'ABC'[k]}`, 64, H / 2 + 2);
      });
      const s = new T.Sprite(new T.SpriteMaterial({map: t.tex, depthTest: false, transparent: true, sizeAttenuation: false}));
      s.scale.set(0.1, 0.025, 1); s.renderOrder = 9;
      s.position.set(1.3 + k * 0.75, 0.3, 0.85 + k * 0.08); this.scene.add(s);
      return {s, t};
    });
  },
  updateFlow(ctx, dt) {
    const tmp = this._tmpV || (this._tmpV = new THREE.Vector3()), geos = new Set();
    for (const f of this.flows) {
      const I = Math.max(0, f.getI(ctx) || 0);
      const nVis = this.showFlow && I > CFG.I_ZERO ? Math.max(3, Math.round(f.n * Math.min(1, 0.25 + I / 4))) : 0;
      f.ph = (f.ph + dt * (0.1 + Math.min(I, 10) * 0.07) * f.speed / f.len) % 1;
      const pos = f.geo.attributes.position.array, col = f.geo.attributes.color.array;
      for (let j = 0; j < f.n; j++) {
        const o = (f.off + j) * 3;
        if (j < nVis) {
          f.curve.getPointAt((f.ph + j / nVis) % 1, tmp);
          pos[o] = tmp.x; pos[o + 1] = tmp.y; pos[o + 2] = tmp.z;
          const b = 0.75 + 0.25 * Math.sin((f.ph + j / nVis) * 40);
          col[o] = f.col.r * b; col[o + 1] = f.col.g * b; col[o + 2] = f.col.b * b;
        } else { col[o] = col[o + 1] = col[o + 2] = 0; pos[o + 1] = -50; }
      }
      geos.add(f.geo);
    }
    geos.forEach(g => { g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true; });
    // Tia lửa
    const S = this.sparks, sp = S.geo.attributes.position.array, sc = S.geo.attributes.color.array;
    const cuts = [0, 1, 2].filter(k => ctx.cut[k] && ctx.vOk[k]);
    S.p.forEach((p, n) => {
      p.life -= dt;
      if (p.life <= 0 && cuts.length && this.showFlow && Math.random() < 0.35) {
        const k = cuts[n % cuts.length];
        Object.assign(p, {x: 3.3 - 0.06, y: 0.05, z: 0.85 + k * 0.08, vx: rnd(-0.6, 0.8), vy: rnd(0.6, 1.6), vz: rnd(-0.6, 0.6), life: rnd(0.25, 0.6)});
      }
      if (p.life > 0) { p.vy -= 4 * dt; p.x += p.vx * dt; p.y = Math.max(0.02, p.y + p.vy * dt); p.z += p.vz * dt; }
      sp[n * 3] = p.x; sp[n * 3 + 1] = p.life > 0 ? p.y : -50; sp[n * 3 + 2] = p.z;
      const b = Math.max(0, p.life) * 2;
      sc[n * 3] = b; sc[n * 3 + 1] = 0.7 * b; sc[n * 3 + 2] = 0.2 * b;
    });
    S.geo.attributes.position.needsUpdate = true; S.geo.attributes.color.needsUpdate = true;
  },

  /* ---------- Camera ---------- */
  home(now) {
    const el = this.renderer && this.renderer.domElement.parentElement, portrait = el && el.clientWidth < el.clientHeight * 1.1;
    const g = portrait ? {theta: 0.5, phi: 1.12, r: 7.8, tx: 1.1, ty: 1.1, tz: 0.6} : {theta: 0.62, phi: 1.13, r: 6.0, tx: 1.4, ty: 1.0, tz: 0.6};
    if (now) Object.assign(this.cam, g); else this.goal = g;
  },
  anchorPos(id) {
    if (id === 'door') return this.door.localToWorld(new THREE.Vector3(1.1, 0.3, 0.1));
    if (id === 'selector') return this.door.localToWorld(new THREE.Vector3(0.6, 0.25, 0.1));
    const a = this.anchors[id]; if (!a) return new THREE.Vector3();
    return /^cap|nguon|den/.test(id) ? a.clone() : this.cabG.localToWorld(a.clone());
  },
  select(id) {
    if (!this.scene || !SEGS.some(s => s.id === id)) return;
    this.sel = id;
    const p = this.anchorPos(id);
    const far = {nguon: 3.6, den: 5.5, vo: 3.2, door: 2.4, selector: 1.6, capA: 3, capB: 3, capC: 3}[id] || 1.35;
    const phi = /^cap/.test(id) ? 0.85 : 1.25, theta = /^cap|den/.test(id) ? 0.35 : 0.3;
    this.goal = {theta, phi, r: far, tx: p.x, ty: /^cap/.test(id) ? 0.1 : p.y - (id === 'den' ? 1.6 : 0.12), tz: p.z};
    this.tick();
  },
  pick(e) {
    const r = this.renderer.domElement.getBoundingClientRect();
    const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    this.ray.setFromCamera(v, this.camera); this.ray.camera = this.camera;
    const hits = this.ray.intersectObjects(this.scene.children, true);
    for (const h of hits) {
      let o = h.object;
      while (o && !o.userData.seg) o = o.parent;
      if (o && (o.visible !== false)) { this.select(o.userData.seg); return; }
    }
  },

  /* ---------- Vòng vẽ ---------- */
  frame(ts) {
    if (!this.renderer || !document.body.contains(this.renderer.domElement)) { this.running = false; this._lt = 0; return; }
    const time = ts / 1000, c = this.cam;
    if (this.goal) {
      let done = true;
      for (const k in this.goal) { const d = this.goal[k] - c[k]; c[k] += d * 0.09; if (Math.abs(d) > 0.002) done = false; }
      if (done) this.goal = null;
    }
    this.camera.position.set(c.tx + c.r * Math.sin(c.phi) * Math.sin(c.theta), c.ty + c.r * Math.cos(c.phi), c.tz + c.r * Math.sin(c.phi) * Math.cos(c.theta));
    this.camera.lookAt(c.tx, c.ty, c.tz);
    this.update(time);
    this.renderer.render(this.scene, this.camera);
    requestAnimationFrame(t => this.frame(t));
  },
  update(time) {
    const cab = App.cabs[this.key]; if (!cab) return;
    const t = cab.tele || {}, v = t.v || [], i = t.i || [], di = t.di || [], d = t.do || [];
    const st = this.st || (this.st = segStatus(cab));
    const pulse = 0.5 + 0.5 * Math.sin(time * 7);
    const night = App.settings.demo && cab.cfg.source === 'sim' ? inWindow(Clock.min(), 1080, 330) : (h => h >= 18 || h < 6)(new Date().getHours());
    this.scene.background = new THREE.Color(night ? '#0e1828' : '#cfe3f5');
    this.hemi.intensity = night ? 0.45 : 0.95; this.sun.intensity = night ? 0.25 : 0.8;

    // Nguồn vào + đèn báo pha trên cửa
    [0, 1, 2].forEach(k => {
      const live = v[k] !== null && v[k] !== undefined && v[k] >= CFG.V_LOST;
      const m = this.P.inCable[k].material;
      m.color.set(live ? [cssVar('--pa'), cssVar('--pb'), cssVar('--pc')][k] : '#6b7480');
      m.emissive.set(live ? m.color : '#000000'); m.emissiveIntensity = live ? 0.25 : 0;
      this.P.pilots[k].material.emissiveIntensity = live ? 0.9 : 0;
      if (!live) this.P.pilots[k].material.color.set('#555');
    });
    // CB, chống sét, contactor
    this.P.lever.rotation.x = di[DI.CB] === 0 ? 0.7 : -0.5;
    this.P.spdWin.material.color.set(di[DI.SPD] === 0 ? '#d63a3a' : '#1f9d55');
    this.P.flags.forEach((f, c) => {
      const fb = FB_OF_DO[c] >= 0 ? di[FB_OF_DO[c]] : d[c];
      const bad = FB_OF_DO[c] >= 0 && d[c] !== undefined && fb !== d[c];
      f.material.color.set(bad ? '#d63a3a' : fb ? '#2ecc71' : '#8a96a3');
      f.material.emissive.set(bad || fb ? f.material.color : '#000'); f.material.emissiveIntensity = bad ? pulse : fb ? 0.5 : 0;
    });
    // Màn hình đồng hồ: chỉ vẽ lại khi có số liệu mới
    if (t !== this.lastTele) {
      this.lastTele = t; this.st = segStatus(cab);
      this.P.meterScr.forEach((s, k) => s.draw(t.v ? [`${num(v[k], 1)} V`, `${num(i[k], 2)} A`] : ['---.- V', '-.-- A']));
      if (this.P.ampTags) this.P.ampTags.forEach((a, k) => a.t.draw(`Pha ${'ABC'[k]}: ${num(i[k], 2)} A`));
    }
    this.P.led.material.color.set(cab.online ? '#2ecc71' : '#d63a3a');
    this.P.led.material.emissive.set(cab.online ? '#2ecc71' : '#d63a3a');
    this.P.led.material.emissiveIntensity = cab.online ? (Math.sin(time * 4) > 0 ? 1 : 0.2) : pulse;
    // Cáp ra + điểm nghi cắt
    [0, 1, 2].forEach(k => {
      const cut = !!cab.active['CAT_CAP' + 'ABC'[k]], on = i[k] > CFG.I_ZERO, col = [cssVar('--pa'), cssVar('--pb'), cssVar('--pc')][k];
      [this.P.outA[k], this.P.outB[k]].forEach((tb, j) => {
        const dead = cut && j === 1;
        tb.material.color.set(dead ? '#6b7480' : col);
        tb.material.emissive.set(on && !dead ? col : cut && j === 0 ? '#ff0000' : '#000');
        tb.material.emissiveIntensity = on && !dead ? 0.35 : cut && j === 0 ? pulse * 0.6 : 0;
      });
      this.P.cut[k].visible = cut; this.P.cut[k].scale.setScalar(0.8 + pulse * 0.6);
    });
    // Cột đèn và cây trang trí
    const closed = c => FB_OF_DO[c] >= 0 ? di[FB_OF_DO[c]] === 1 : d[c] === 1;
    // Dòng điện chạy trong dây
    const iA = [0, 1, 2].map(k => i[k] || 0), tot = iA.reduce((a, b) => a + b, 0);
    const wsum = SIM_SHARE.reduce((s, w, c) => s + (closed(c) ? w : 0), 0);
    const perPhasePosts = [0, 1, 2].map(k => this.P.posts.filter(p => p.ph === k && closed(p.ch)).length || 1);
    const ctx = {
      i: iA, vOk: [0, 1, 2].map(k => (v[k] || 0) >= CFG.V_LOST),
      cut: [0, 1, 2].map(k => !!cab.active['CAT_CAP' + 'ABC'[k]]),
      kI: [0, 1, 2, 3].map(c => closed(c) && wsum > 0 ? tot * SIM_SHARE[c] / wsum : 0),
      postI: this.P.posts.map(p => closed(p.ch) && iA[p.ph] > CFG.I_ZERO ? iA[p.ph] / perPhasePosts[p.ph] : 0)
    };
    const dt = Math.min(0.1, time - (this._lt || time)); this._lt = time;
    if (this.flows) this.updateFlow(ctx, dt);
    this.P.posts.forEach(p => {
      const lit = closed(p.ch) && i[p.ph] > CFG.I_ZERO;
      p.head.material.emissive.set(lit ? '#ffe9a0' : '#000'); p.head.material.emissiveIntensity = lit ? 1 : 0;
      p.cone.visible = lit; p.cone.material.opacity = night ? 0.13 : 0.05;
    });
    const k3 = closed(2) && i.some(x => x > CFG.I_ZERO);
    this.P.garland.forEach((b, n) => { const col = ['#ff5a5a', '#ffd23f', '#5ec2ff'][n % 3]; b.material.color.set(k3 ? col : '#555'); b.material.emissive.set(k3 ? col : '#000'); b.material.emissiveIntensity = k3 ? 0.6 + 0.4 * Math.sin(time * 3 + n) : 0; });
    // Cửa: mở thật thì xoay ra; "nhìn xuyên" làm mờ cửa khi đang đóng
    const goalA = di[DI.DOOR] ? -1.75 : 0;
    this.doorAngle += (goalA - this.doorAngle) * 0.08; this.door.rotation.y = this.doorAngle;
    const dm = this.P.doorPanel.material; dm.opacity = this.seeThrough && Math.abs(this.doorAngle) < 0.3 ? 0.16 : 1; dm.depthWrite = dm.opacity > 0.5;
    // Đang nhìn xuyên: ẩn biển tên, đèn báo, công tắc trên cửa để không che thiết bị bên trong
    const decor = dm.opacity > 0.5 || this.sel === 'door' || this.sel === 'selector';
    this.P.doorDecor.forEach(o => { o.visible = decor; });
    this.P.selector.rotation.z = di[DI.AUTO] === 0 ? 0.8 : -0.8;
    // Vỏ tủ nghiêng / rung khi va chạm
    const tilt = cab.active.NGHIENG ? Math.min(30, t.tilt || 20) : 0;
    this.cabG.rotation.z += (-tilt * Math.PI / 180 - this.cabG.rotation.z) * 0.05;
    this.cabG.position.x = cab.active.VA_CHAM ? Math.sin(time * 45) * 0.012 : 0;

    // Nhấp nháy bộ phận có sự cố, tô xanh bộ phận đang chọn
    for (const id in this.seg) {
      const s = st[id], alarm = s && s.sev > 0, live = s && s.live.length > 0;
      this.seg[id].forEach(m => {
        if (m.userData.hl === false) return;
        const mt = m.material;
        if (live) { mt.emissive.set(s.sev >= 3 ? '#ff1e1e' : '#ff9500'); mt.emissiveIntensity = 0.25 + pulse * 0.6; }
        else if (alarm) { mt.emissive.set('#ff9500'); mt.emissiveIntensity = 0.25; }
        else if (id === this.sel) { mt.emissive.set('#1a6fd8'); mt.emissiveIntensity = 0.35; }
        else { mt.emissive.setHex(mt.userData.base || 0); mt.emissiveIntensity = 1; }
      });
    }
    for (const id in this.markers) {
      const m = this.markers[id], s = st[id];
      m.visible = !!(s && s.sev > 0);
      if (m.visible) { m.position.copy(this.anchorPos(id)); m.position.y += 0.04 * Math.sin(time * 3); m.material.opacity = s.live.length ? 0.75 + pulse * 0.25 : 0.7; }
    }
  },

  /* ---------- Phần giao diện HTML quanh mô hình ---------- */
  tick() {
    const cab = App.cabs[this.key]; if (!cab || !document.getElementById('seg3d')) return;
    this.st = segStatus(cab);
    const head = document.getElementById('cabHead'); if (head) head.innerHTML = cabHeadHtml(cab);
    document.getElementById('seg3d').innerHTML = segPanelHtml(cab, this.st);
    const info = document.getElementById('v3info');
    if (info) {
      if (!this.sel) { info.hidden = true; }
      else {
        const s = this.st[this.sel], seg = SEGS.find(x => x.id === this.sel);
        info.hidden = false;
        info.innerHTML = `<div class="row"><b class="grow">${seg.icon} ${esc(segName(cab, this.sel))}</b>${s.sev ? `<span class="pill ${s.sev >= 3 ? 'bad' : 'warn'}">Sự cố</span>` : '<span class="pill ok">Bình thường</span>'}<button class="btn sm" data-act="v3-close" aria-label="Đóng">✕</button></div>
          <div class="sub" style="margin-top:4px">${segDetail(cab, this.sel)}</div>
          ${s.inc.map(x => `<div class="sub" style="margin-top:4px;color:var(--ink)">⚠️ ${incLine(x)}</div>`).join('')}
          ${s.inc.length ? `<div class="btns" style="margin-top:6px">${s.inc[0].status === 'new' ? `<button class="btn sm pri" data-act="inc" data-op="assign" data-no="${s.inc[0].no}">Giao ${esc(s.inc[0].team)}</button>` : ''}<button class="btn sm" data-act="inc" data-op="zalo" data-no="${s.inc[0].no}">📤 Zalo</button></div>` : ''}`;
      }
    }
  }
};
function segPanelHtml(cab, st) {
  const bad = SEGS.filter(s => st[s.id].sev > 0).sort((a, b) => st[b.id].sev - st[a.id].sev), ok = SEGS.filter(s => !st[s.id].sev);
  return `<div class="row"><h2 class="grow" style="margin:0">Phân đoạn sự cố</h2><button class="btn sm" data-act="v3-report">📋 Báo cáo phân đoạn</button></div>
    <p class="sub">${bad.length ? `<b style="color:var(--bad)">${bad.length}</b>/${SEGS.length} phân đoạn có sự cố. Bấm 🎯 để camera tới đúng vị trí.` : `Cả ${SEGS.length} phân đoạn bình thường.`}</p>
    ${bad.map(s => {
      const x = st[s.id];
      return `<div class="io" style="align-items:flex-start"><span class="led bad" style="margin-top:4px"></span><div class="grow">
        <b>${s.icon} ${esc(segName(cab, s.id))}</b> <span class="pill ${x.sev >= 3 ? 'bad' : 'warn'}">${x.live.length ? 'Đang báo' : 'Chờ xử lý'}</span>
        <div class="sub">${segDetail(cab, s.id)}</div>
        ${x.inc.map(i => `<div class="sub" style="color:var(--ink)">${incLine(i)}</div>`).join('')}
        <div class="btns" style="margin-top:6px"><button class="btn sm" data-act="v3-focus" data-seg="${s.id}">🎯 Xem trên 3D</button>
          ${x.inc[0] && x.inc[0].status === 'new' ? `<button class="btn sm pri" data-act="inc" data-op="assign" data-no="${x.inc[0].no}">Giao ${esc(x.inc[0].team)}</button>` : ''}
          ${x.inc[0] ? `<button class="btn sm" data-act="inc" data-op="zalo" data-no="${x.inc[0].no}">📤 Zalo</button>` : ''}</div></div></div>`;
    }).join('')}
    <h3>Bình thường (${ok.length})</h3>
    <div class="lamps">${ok.map(s => `<button class="lamp" data-act="v3-focus" data-seg="${s.id}" style="cursor:pointer"><i style="background:var(--ok)"></i>${esc(segName(cab, s.id).replace('Contactor ', ''))}</button>`).join('')}</div>`;
}
function tab3D(cab) {
  return `<div class="panel v3wrap"><div id="v3d"><div class="empty">Đang tải mô hình 3D…</div></div>
      <div class="v3tools">
        <button class="btn sm" data-act="v3-home" title="Toàn cảnh">🎯 Toàn cảnh</button>
        <button class="btn sm" data-act="v3-see" title="Nhìn xuyên cửa tủ">${V3.seeThrough ? '🚪 Hiện cửa' : '👁️ Nhìn xuyên'}</button>
        <button class="btn sm" data-act="v3-flow" title="Hiện dòng điện chạy trong dây">${V3.showFlow === false ? '⚡ Hiện dòng điện' : '⚡ Ẩn dòng điện'}</button>
      </div>
      <div class="v3legend"><span><i style="background:var(--pa)"></i>A</span><span><i style="background:var(--pb)"></i>B</span><span><i style="background:var(--pc)"></i>C</span><span><i style="background:#ffe08a"></i>ra kênh</span><em>Hạt chạy nhanh, dày = dòng lớn</em></div>
      <div class="v3info" id="v3info" hidden></div>
      <div class="v3hint">Kéo để xoay · chụm 2 ngón hoặc lăn chuột để phóng to · chạm vào bộ phận để xem</div>
    </div>
    <div class="panel" id="seg3d"></div>`;
}

/* ---------- Khởi động ---------- */
App.init();
updateHeader();
render(true);
setInterval(loop, 1000);
if (App.settings.mq.auto) mqToggle();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
